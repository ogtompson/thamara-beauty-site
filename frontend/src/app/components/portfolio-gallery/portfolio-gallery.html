<section class="portfolio section-reveal" id="portfolio" aria-labelledby="portfolio-title">
  <div class="portfolio__header">
    <span class="portfolio__eyebrow">Resultados reais</span>
    <h2 id="portfolio-title">Portfólio</h2>
    <p>Conheça alguns trabalhos realizados com cuidado, técnica e atenção aos detalhes.</p>
  </div>

  <div class="gallery" role="list">
    @for (item of items; track item.imageUrl) {
      <article class="gallery__card" role="listitem">
        <img [src]="item.imageUrl" [alt]="item.title" loading="lazy" />
        <div class="gallery__card-info">
          <span>{{ item.category }}</span>
          <h3>{{ item.title }}</h3>
        </div>
      </article>
    }
  </div>
</section>
