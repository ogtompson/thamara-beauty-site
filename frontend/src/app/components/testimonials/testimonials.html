<section class="testimonials section-reveal">
  <div class="testimonials__header">
    <span class="testimonials__eyebrow">O que dizem</span>
    <h2>Quem já passou por aqui</h2>
  </div>

  @if (items.length) {
    <div class="testimonials__marquee">
      <div
        class="testimonials__track"
        [style.--marquee-duration]="animationDuration + 's'"
      >
        <div class="testimonials__group" role="list" aria-label="Depoimentos de clientes">
          @for (item of items; track item.authorHandle) {
            <ng-container
              [ngTemplateOutlet]="testimonialCard"
              [ngTemplateOutletContext]="{ $implicit: item, focusable: true }"
            />
          }
        </div>

        <div class="testimonials__group testimonials__group--duplicate" aria-hidden="true">
          @for (item of items; track item.authorHandle) {
            <ng-container
              [ngTemplateOutlet]="testimonialCard"
              [ngTemplateOutletContext]="{ $implicit: item, focusable: false }"
            />
          }
        </div>
      </div>
    </div>
  }
</section>

<ng-template #testimonialCard let-item let-focusable="focusable">
  <article
    class="testimonials__card"
    role="listitem"
    [attr.tabindex]="focusable ? 0 : null"
  >
    <div class="testimonials__card-header">
      <img [src]="item.authorAvatar" [alt]="item.authorName" class="testimonials__avatar" />
      <div>
        <strong>{{ item.authorName }}</strong>
        <span>{{ item.authorHandle }}</span>
      </div>
      <svg
        class="testimonials__ig-icon"
        viewBox="0 0 24 24"
        fill="currentColor"
        width="18"
        height="18"
        aria-hidden="true"
      >

      </svg>
    </div>

    <p class="testimonials__text">{{ item.text }}</p>

    @if (item.likes) {
      <div class="testimonials__likes">❤ {{ item.likes }} curtidas</div>
    }
  </article>
</ng-template>
