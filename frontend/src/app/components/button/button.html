@if (href) {
  <a
    [href]="href"
    class="btn"
    [class.btn--primary]="variant === 'primary'"
    [class.btn--secondary]="variant === 'secondary'"
    [class.btn--ghost]="variant === 'ghost'"
  >
    <ng-container [ngTemplateOutlet]="buttonContent" />
  </a>
} @else {
  <button
    [type]="type"
    class="btn"
    [class.btn--primary]="variant === 'primary'"
    [class.btn--secondary]="variant === 'secondary'"
    [class.btn--ghost]="variant === 'ghost'"
  >
    <ng-container [ngTemplateOutlet]="buttonContent" />
  </button>
}

<ng-template #buttonContent>
  <ng-content></ng-content>
</ng-template>
