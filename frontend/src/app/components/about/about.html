<section class="about section-reveal" id="sobre">
    <div class="about__container">
  
      <div class="about__photo">
        <img [src]="photoUrl" [alt]="name" loading="lazy" />
      </div>
  
      <div class="about__content">
        <span class="about__eyebrow">Quem atende</span>
        <h2>{{ name }}</h2>
  
        <p class="about__bio">{{ bio }}</p>
        <p class="about__specialty">{{ specialty }}</p>
  
        <div class="about__actions">
          <app-button variant="primary" href="#agendar">Conversar com a Thamara</app-button>
          <app-button variant="ghost" href="https://instagram.com/thamaravasconcelospmu" >
            &#64;thamaravasconcelospmu
          </app-button>
        </div>
      </div>
  
    </div>
  </section>
