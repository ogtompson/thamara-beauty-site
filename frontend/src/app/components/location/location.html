<section class="location section-reveal" id="local">
    <div class="location__header">
      <span class="location__eyebrow">Como chegar</span>
      <h2>Onde nos encontrar</h2>
    </div>
  
    <div class="location__map">
      <iframe
        [src]="safeMapUrl"
        title="Mapa da Thamara Vasconcelos Beauty Academy"
        width="100%"
        height="100%"
        style="border:0;"
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
    </div>
  
    <div class="location__cards">
      @for (card of cards; track card.label) {
        <div class="location__card">
          <div class="location__card-icon">
            @switch (card.icon) {
              @case ('address') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.5-7-11a7 7 0 0 1 14 0c0 4.5-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>
              }
              @case ('whatsapp') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-4.2-7.6L21 3l-1.2 4A9 9 0 0 1 21 12Z"/><path d="M8 10.5c.5 2 2.5 4 4.5 4.5"/></svg>
              }
              @case ('clock') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
              }
              @case ('instagram') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
              }
            }
          </div>
          <h4>{{ card.label }}</h4>
          <p>{{ card.value }}</p>
        </div>
      }
    </div>
  </section>
